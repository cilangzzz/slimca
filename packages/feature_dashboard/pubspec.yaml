name: feature_dashboard
resolution: workspace
description: "Slimca 日期仪表盘：卡片墙（热量环/支出/净热量/存钱进度）、周历切日共享轴与 day_summary 投影接线（§3.2/§5.6⑬、§10.4）。"
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # 单仓分包 path 依赖（§10.4）：领域日期约定/校验（core_domain）、day_summary
  # 投影行（core_db）、三层 token 与 P0 转场库（ui_kit，§8.2/§9.3）。
  core_domain:
    path: ../core_domain
  core_db:
    path: ../core_db
  ui_kit:
    path: ../ui_kit
  # day_summary 投影的 Drift 查询/watch（§5.6⑬）：innerJoin 聚合 + reactive
  # stream 直驱卡片墙；版本与 core_db 对齐（§10.1 Drift 2.x）。
  drift: ^2.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # 卡片墙/空态引导使用 Material 图标（widget 测试同样可渲染）
  uses-material-design: true
