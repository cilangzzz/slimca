name: feature_ledger
resolution: workspace
description: "Slimca 账本域：按日分组账单流（entry+lines join）、分类管理（categories 增删改）、每日目标（budgets period=daily）、日简报（day_summary 投影直读）与月度分类汇总雏形（§3.4/§5.4、§11.1 W5-6）。"
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # 单仓分包 path 依赖（§10.4）：领域模型与日期口径（core_domain）、
  # ledgers/categories/budgets/day_summary 真值表（core_db）、三层 token 与
  # P0 转场库（ui_kit，§8.2/§9.3）。
  core_domain:
    path: ../core_domain
  core_db:
    path: ../core_db
  ui_kit:
    path: ../ui_kit
  # 账单流/分类汇总的 Drift join 与 customSelect watch（§5.6⑬）；版本与
  # core_db 对齐（§10.1 Drift 2.x）。
  drift: ^2.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # 账单行/分类行/空态引导使用 Material 图标（widget 测试同样可渲染）
  uses-material-design: true
