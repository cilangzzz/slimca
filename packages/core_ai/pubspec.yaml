name: core_ai
resolution: workspace
description: "Slimca AI 解析域：LLM adapter（OpenAI 兼容协议）+ 受约束 JSON 解析管线 + input_hash 缓存与四级降级接口 + 拍照通道（端侧压缩/百度菜品识别/Vision LLM 双供应商 fallback，§7、§10.4、§11.2 W11-12）。"
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # §10.4：领域枚举（LineType/LineDirection/EntryKind）与日历日校验复用
  # core_domain——AI 产出的行草稿与 §5.2 枚举一字不差，杜绝映射漂移。
  core_domain:
    path: ../core_domain
  # §5.6⑭ ai_parses 表（缓存留痕）与 §5.1 UUIDv7 生成复用 core_db：
  # DriftAiParseCache 直读直写该表，entries.ai_parse_id 溯源同源。
  core_db:
    path: ../core_db
  # 与 core_db 同版本对齐（§10.1 数据层 Drift 2.x）。
  drift: ^2.29.0
  # §7.1「LLM adapter（OpenAI 兼容协议，可插拔）」：协议层走 http。
  http: ^1.2.0
  # §7.1「规范化 + input_hash（sha256）」：缓存键计算。
  crypto: ^3.0.0
  # §3.3 拍照通道「端侧压缩（长边 1280、JPEG q80）」：纯 Dart 图片编解码
  # （W11-12；无平台通道，测试离线可跑真实 codec）。
  image: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
