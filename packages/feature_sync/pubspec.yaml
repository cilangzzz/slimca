name: feature_sync
resolution: workspace
description: "Slimca 同步域：LocalSyncEngine（outbox 批量上送 + per-table 游标增量拉取 + §6.5 冲突矩阵仲裁）、SyncBackend 抽象（InMemorySyncBackend 模拟远端 / LocalLoopbackBackend 本地回环）、设备注册（§6、§5.6⑯⑰⑱、§10.4 packages/feature_sync）。"
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # 单仓分包 path 依赖（§10.4）：SyncEngine 抽象/outbox 模型/HlcClock 在
  # core_domain；AppDatabase/仓库/投影/LocalWriteClock 在 core_db。
  core_domain:
    path: ../core_domain
  core_db:
    path: ../core_db
  # 引擎直接读写 Drift 行（generic apply/custom SQL/事务 API）；版本与 core_db 对齐
  drift: ^2.29.0
  # W7-8 托管 Supabase RPC（§6.2/§11.1）：纯 Dart core 包（不用 supabase_flutter，
  # 同步层不依赖平台通道/插件，§6.1 本地优先）。锁 2.13.x：2.14+ 要求 Dart SDK
  # >=3.9.0，与工作区 ^3.8.0 冲突。
  supabase: ^2.13.4
  # 传输层异常分类（ClientException → network 错，§6.1 原则 1）。
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
