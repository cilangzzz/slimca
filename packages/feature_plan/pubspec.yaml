name: feature_plan
resolution: workspace
description: "Slimca 计划域：健身手动记录（MET 估算→消耗行）、待办（重复/提醒）、存钱目标、健身计划（模板排期/组间计时/组明细/训练历史，§3.5/§3.6/§5.5、§11.1 W5-6、§11.2 W13-W14、§10.4）。"
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # 状态管理：Riverpod 3（AsyncNotifier 表单控制器 + StreamProvider 投影直读，
  # §10.1 状态选型，与 feature_capture 同口径）
  flutter_riverpod: ^3.0.0
  # 单仓分包 path 依赖（§10.4）：领域实体/仓库接口/HlcClock、Drift schema 与
  # TodoDao/day_summary 投影、ui_kit token 与转场（动效只引用既有 token，§9.2）
  core_domain:
    path: ../core_domain
  core_db:
    path: ../core_db
  ui_kit:
    path: ../ui_kit
  # 网关直接读写 Drift 行（事务/查询 API）；版本与 core_db/apps 对齐
  drift: ^2.29.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # 运动类型/待办/存钱等控件使用 Material 图标（widget 测试同样可渲染）
  uses-material-design: true
