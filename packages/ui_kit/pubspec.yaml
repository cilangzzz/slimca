name: ui_kit
resolution: workspace
description: "Slimca UI 基建：三层设计 token、MotionConfig、语义组件与关键转场库（§8/§9）。"
version: 0.0.1
homepage:

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # §8.2 第 1 层：种子色 → HCT tonal palette（版本与 Flutter 3.32 SDK 钉定版本一致）
  material_color_utilities: ^0.11.1
  # §8.3 dynamic_color（Android 12+ Material You 平台取色；两源映射见
  # src/tokens/dynamic_color.dart，不支持平台回退手动种子色）
  # 1.8.1 精确 pin：1.9.0 的 android/build.gradle.kts 有上游 bug（未应用 kotlin
  # 插件却用 kotlin{} 扩展、自带 buildscript 硬编码 AGP 8.13.1），release 构建必挂；
  # 2.x 需 material_color_utilities ^0.13.0，与 Flutter 3.32 钉定 0.11.1 冲突。
  # 待 Flutter SDK 升级后再评估 2.x（2026-11-17 构建实测）
  dynamic_color: 1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
