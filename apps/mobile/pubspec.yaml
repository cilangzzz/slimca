name: slimca
resolution: workspace
description: "Slimca 主应用壳：路由 + DI + 主题装配（§10.4 apps/mobile）"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+2

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # 状态管理：Riverpod 3（§10.1，编译期安全，AsyncNotifier 适配离线队列）
  flutter_riverpod: ^3.0.0
  # 路由：go_router StatefulShellRoute 承载 4 Tab 各自导航栈（§4.3、§10.1）
  go_router: ^16.0.0

  # 单仓分包 path 依赖（§10.4）：ui_kit 主题/动效 token；core_domain 实体与仓库接口；
  # core_db Drift schema 与 day_summary 投影；feature_capture 唯一录入 UI（W3-4
  # 收敛：壳采用其 CapturePage/网关/解析器注入点）；core_ai LLM 解析管线底座；
  # feature_sync 同步引擎与后端抽象（W7-8 §6.2 接线）。
  ui_kit:
    path: ../../packages/ui_kit
  core_domain:
    path: ../../packages/core_domain
  core_db:
    path: ../../packages/core_db
  feature_capture:
    path: ../../packages/feature_capture
  core_ai:
    path: ../../packages/core_ai
  feature_sync:
    path: ../../packages/feature_sync
  # W14 健身计划模板建档/编辑页装配（§10.4「壳负责装配」）：计划 Tab 排期卡
  # 「模板」入口 → /plan/plans（feature_plan FitnessPlanPage）——模板=动作/
  # 组数/重量配比/休息秒+按周排期（§5.5⑧），壳内不重复建档 UI。
  feature_plan:
    path: ../../packages/feature_plan

  # W15 账本域装配（§11.2 W15「多账本+预算体系+统计报表」、§10.4「壳负责
  # 装配」）：预算设置页每日/月度/分类目标写路径（LedgerAdminRepository →
  # core_db BudgetsDao 收口 §5.4⑥/§5.6⑬）+ 分类管理页（CategoryManagePage）
  # + 账本管理页（LedgerManagePage §5.4④）+ 统计报表页（ReportPage
  # §3.4/§11.2）+ 预算快照 v2 解析（parseBudgetSnapshot）+ 分类色 token
  # 解析（§8.2）。
  feature_ledger:
    path: ../../packages/feature_ledger

  # W2 接线直用依赖（core_db 的传递依赖提升为直接依赖，§10.1）：
  # drift——App 侧 reactive stream 直驱仪表盘（join/watch/事务，§10.1 数据层）；
  drift: ^2.29.0
  # uuid——UUIDv7 主键生成（§5.1 应用层生成、时间有序）与 §6.3 device_id
  # （取 UUIDv7 前 12 位 hex，复用 core_domain Hlc.nodeIdFromUuidV7）。
  uuid: ^4.6.0
  # path_provider——W7-8 遥测落盘目录（§3.9 监控；support 目录/telemetry）。
  path_provider: ^2.1.0

  # W11-12 拍照通道接线（§11.2、§3.3 拍照通道；§10.4 壳层插件依赖）：
  # image_picker——拍照/相册双入口（ImageSource.camera/gallery 薄封装经
  #   captureImageSourceProvider 注入，测试用 FakeImageSource 禁真实相机）；
  #   端侧压缩在拾取参数内完成（长边 1280、JPEG q80，§3.3）。
  image_picker: ^1.1.2
  # crypto——压缩产物 sha256 content_hash（一址两用：attachments 去重键
  #   §5.6㉑ + ai_parses.input_hash photo 缓存键 §5.6⑭）。
  crypto: ^3.0.0
  # http——百度菜品识别 / Vision LLM 传输层（§3.3 双供应商防单点；真实凭据
  #   未提供，dart-define 注入、缺省离线桩，remaining：待凭据联调）。
  http: ^1.2.0

  # W13 本地通知接线（§11.2 W13 任务 3）：flutter_local_notifications——
  #   待办提醒真实通道（Android 13+ POST_NOTIFICATIONS 运行时请求在
  #   FlutterLocalReminderScheduler 内接线，真机验收 remaining）；
  # timezone——zonedSchedule 的 TZDateTime 绝对瞬间构造（remind_at=UTC ms
  #   口径，与设备时区无关，§5.5⑩）。
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # W14 组间计时器接线（§11.2 W14 任务 2）：wakelock_plus——训练进行中
  #   屏幕常亮（KeepAwakeService 抽象的 wakelock_plus 适配器；Android 走
  #   FLAG_KEEP_SCREEN_ON 窗口旗标、免 WAKE_LOCK 权限声明，§3.3 最小权限）。
  #   真实行为真机验收 remaining（集成环境无真机——测试注入 Fake）。
  #   wakelock_plus ^1.4.0——Dart 3.8 兼容上限（1.5+ 需 Dart 3.10/Flutter 3.38）。
  wakelock_plus: ^1.4.0

  # W16 主题系统接线（§11.2 W16、§8.2/§8.3）：
  # material_color_utilities——CorePalette（§8.3 dynamic_color 两源映射的
  #   平台取色类型，ui_kit CorePaletteLoader 契约）与测试合成取色
  #   （CorePalette.of）；版本与 ui_kit 钉定一致。
  #   （dynamic_color 插件通道由 ui_kit 承载——loadPlatformCorePalette，
  #   壳层不再直依赖插件。）
  material_color_utilities: ^0.11.1

  # V1 UX 插曲（《UI-规范与重设计》§4.1 尾部低频组「版本」行）：运行时读取
  # pubspec version+build（原 W1-W16 无此依赖；本包已在 pubspec.lock 以传递
  # 依赖解析 9.0.1，提升为直接依赖不改锁）。设置页 FutureBuilder 消费——
  # 插件通道不可用的环境（如 widget 测试）渲染占位「—」，不阻塞页面装配。
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

